name: glimstone_demos
description: The Flutter demos on the GlimStone site.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  glimstone:
    path: ..

flutter:
  # Plex comes with the package. Noto Sans stands behind it for the scripts Plex
  # does not draw, and an app ships it itself; the variable file carries every weight.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: fonts/NotoSans.ttf
