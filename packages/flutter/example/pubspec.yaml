name: glimstone_demos
description: The Flutter demos on the GlimStone site.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  glimstone:
    path: ..

flutter:
  # The house font, which an app ships itself; the variable file carries every weight.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: fonts/NotoSans.ttf
