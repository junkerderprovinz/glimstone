name: glimstone
description: GlimStone's tokens, glyphs and widgets for Flutter.
version: 4.9.2
homepage: https://junkerderprovinz.github.io/glimstone/
repository: https://github.com/junkerderprovinz/glimstone/tree/main/packages/flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # The house face. The variable file carries every weight; the OFL beside it
  # is its licence.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans.ttf
