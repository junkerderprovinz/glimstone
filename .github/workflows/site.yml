name: Site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The drift manifest hashes every release tag.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: bash scripts/check-classes.sh
      - run: npm test
      - run: npm run build:packages
      - run: node scripts/size-budget.mjs
      - run: node scripts/gen-flutter.mjs --check
      - run: node scripts/build-tokens.mjs --check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # 3.50 deprecates package:flutter/material.dart, which the package still imports.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get && flutter analyze && flutter test --machine > ../../site/flutter-results.jsonl
        working-directory: packages/flutter
      - run: flutter pub get && flutter build web --release --no-web-resources-cdn
        working-directory: packages/flutter/example
      - run: node scripts/place-flutter-demos.mjs
      - run: npm run typecheck
        working-directory: site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flutter
          path: |
            site/public/flutter
            site/flutter-results.jsonl
          retention-days: 1

  # One Playwright project per job, so four frameworks in two browsers run side
  # by side instead of one after another.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [react, vue, solid, svelte, react-firefox, vue-firefox, solid-firefox, svelte-firefox, a11y]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps ${{ endsWith(matrix.project, '-firefox') && 'firefox' || 'chromium' }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-${{ matrix.project }}
          path: site/test-results/raw.json
          retention-days: 1

  # The screenshots are compared in the image they were rendered in, so fonts
  # and antialiasing match the baselines.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash site/playwright-linux.sh --project=visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-diffs
          path: site/test-results
          retention-days: 7

  # The site shows each contract row's result, so it is built once every
  # project has reported.
  site:
    needs: [checks, browsers, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flutter
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: results-*
          path: site/reports
      - run: npm run gen && node collect.mjs reports/*/raw.json && npm run build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: [site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
